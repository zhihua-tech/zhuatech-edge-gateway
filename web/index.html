<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华边缘网关</title><style>:root{font-family:Inter,"PingFang SC",sans-serif;color:#202a38;background:#eef1f4}*{box-sizing:border-box}body{margin:0}.head{height:62px;background:#202b38;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.head b{font-size:18px}.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 62px)}aside{background:#293644;color:#c8d0d8;padding:20px 14px}.nav div{padding:11px 13px;border-radius:6px;margin:4px}.nav .on{background:#d18432;color:#fff}main{padding:27px 30px}.title{display:flex;justify-content:space-between}.title h1{font-size:23px;margin:0}.sub{color:#7b8794;font-size:13px}.badge{background:#fff3e3;color:#a75c13;padding:7px 12px;border-radius:15px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin:22px 0}.card{background:#fff;border:1px solid #dfe4e9;border-radius:7px;padding:17px}.stat b{font-size:26px;display:block;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}h2{font-size:15px;margin:0 0 12px}.row{display:grid;grid-template-columns:1.5fr 1fr .8fr;gap:10px;border-top:1px solid #edf0f2;padding:13px 0}.value{font-family:ui-monospace,monospace;font-size:18px}.good{color:#19805e}.event{padding:12px 0;border-top:1px solid #edf0f2}.event b{color:#a75c13}@media(max-width:850px){.shell{grid-template-columns:1fr}aside{display:none}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><b>知华边缘计算网关</b><span>节点 EG-SH-001 · 本地时间同步</span></header><div class="shell"><aside><div class="nav"><div class="on">运行总览</div><div>协议适配器</div><div>测点映射</div><div>本地规则</div><div>数据队列</div><div>配置版本</div><div>诊断日志</div></div></aside><main><div class="title"><div><h1>网关运行态势</h1><div class="sub">协议采集、边缘计算与断网续传</div></div><span class="badge" id="cloud">云端链路检测中</span></div><div class="stats" id="stats"></div><div class="grid"><section class="card"><h2>实时测点</h2><div id="points"></div></section><section class="card"><h2>本地规则事件</h2><div id="events"></div></section></div></main></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/dashboard',{headers:{'x-api-key':'zhuatech-demo-key'}}).then(r=>r.json()).then(d=>{const n={adapters:'适配器',points:'测点',rules:'本地规则',pending:'待上传',cloudOnline:'云端在线'};stats.innerHTML=Object.entries(d.metrics).map(([k,v])=>`<div class="card stat"><span class="sub">${n[k]}</span><b>${typeof v==='boolean'?(v?'是':'否'):v}</b></div>`).join('');cloud.textContent=d.metrics.cloudOnline?'云端链路正常':'离线运行 · 数据已缓存';points.innerHTML=(d.points||[]).map(x=>`<div class="row"><div><b>${esc(x.code)}</b><div class="sub">${esc(x.address)}</div></div><span class="value">${Number(x.value).toFixed(1)} ${esc(x.unit)}</span><span class="good">${esc(x.quality)}</span></div>`).join('');events.innerHTML=(d.events||[]).slice(-8).reverse().map(x=>`<div class="event"><b>${esc(x.action)}</b><div>${esc(x.pointCode)} = ${x.value}</div><span class="sub">${esc(x.occurredAt)}</span></div>`).join('')})</script></body></html>
